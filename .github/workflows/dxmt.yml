name: Ambre — essai DXGI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dxgi:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Sources et outils
        run: |
          git init -q dxmt-src
          git -C dxmt-src remote add origin https://github.com/3Shain/dxmt.git
          git -C dxmt-src fetch -q --depth 1 origin fb4515681daefb789a4d0f403c4bdbca88f3b3de
          git -C dxmt-src checkout -q FETCH_HEAD
          git -C dxmt-src submodule update -q --init --recursive --depth 1
          for patch in dxmt/patches/*.patch; do git -C dxmt-src apply "$GITHUB_WORKSPACE/$patch"; done
          mkdir -p dxmt-src/toolchains/{wine,llvm-darwin/include}
          curl -fsSL https://github.com/3Shain/wine/releases/download/v8.16-3shain/wine.tar.gz | tar -xz -C dxmt-src/toolchains/wine
          brew install -q mingw-w64 ninja
          pip3 install -q meson==1.10.0 --break-system-packages
          x=$(ls -d /Applications/Xcode_16.1.app /Applications/Xcode_16*.app 2>/dev/null | head -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
      - name: Compiler dxgi.dll uniquement
        working-directory: dxmt-src
        run: |
          meson setup --cross-file build-win64.txt -Dwine_install_path=toolchains/wine             -Dnative_llvm_path=toolchains/llvm-darwin build --buildtype release
          ninja -C build src/dxgi/dxgi.dll.postproc
          x86_64-w64-mingw32-strip --strip-unneeded build/src/dxgi/dxgi.dll
          test "$(dd if=build/src/dxgi/dxgi.dll bs=1 skip=64 count=16 2>/dev/null)" = "Wine builtin DLL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dxgi-pour-essai
          path: dxmt-src/build/src/dxgi/dxgi.dll
