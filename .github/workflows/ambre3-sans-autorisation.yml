name: Ambre 3 sans autorisation (natif ARM64, essai)

# Ambre 3, voie sans compte payant (5 nov. 2026) : Wine natif pour la puce Apple, sans Rosetta, et
# sans l'autorisation Apple « cross-architecture-support ». Base : la recette de MetalSharp-Wine
# (https://github.com/metalsharp/MetalSharp-Wine ; scripts AGPL-3.0, Wine LGPL, FEX MIT, Mullion
# LGPL), à une version figée. Sans l'autorisation : programmes x86-64 et ARM64 en pages de 16 Ko,
# ordre mémoire Intel imité par FEX ; pas de 32 bits. Archive signée ad hoc (aucun compte Apple).
# Utilisée seulement pour l'essai sur le Mac de Victor ; pas de distribution.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Version de MetalSharp-Wine (étiquette)"
        default: "v5.0"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Recette de MetalSharp-Wine
        uses: actions/checkout@v4
        with:
          repository: metalsharp/MetalSharp-Wine
          ref: ${{ inputs.ref }}
          path: ms
          persist-credentials: false

      - name: llvm-mingw (chaîne de compilation Windows attendue par la recette)
        working-directory: ms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p toolchain
          gh release download 20261020 -R mstorsjo/llvm-mingw -p 'llvm-mingw-20261020-ucrt-macos-universal.tar.xz' -D toolchain
          tar -xJf toolchain/llvm-mingw-20261020-ucrt-macos-universal.tar.xz -C toolchain
          ls toolchain/llvm-mingw-20261020-ucrt-macos-universal/bin | head -3

      - name: Sources (Wine, FEX, Mullion, VKD3D-Proton, DXVK…)
        working-directory: ms
        run: |
          export JOBS=$(sysctl -n hw.ncpu)
          zsh scripts/fetch-sources.sh
          git submodule update --init --recursive src/FEX src/dxvk-macos
          # Scripts de llvm-mingw à la même version que la chaîne (build-arm64ec-runtimes.sh :
          # bibliothèques C, compiler-rt et libc++ recompilées en ARM64X, nécessaires à FEX).
          git clone --depth 1 --branch 20261020 https://github.com/mstorsjo/llvm-mingw.git src/llvm-mingw
          for d in src/*; do echo "$d : $(git -C "$d" rev-parse --short HEAD 2>/dev/null)"; done

      - name: Xcode et outils Metal
        run: |
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true
          xcrun -sdk macosx metal --version || true

      - name: Outils Homebrew
        run: brew install cmake ninja meson pkgconf autoconf automake libtool bison flex nasm gettext gperf

      # Dépendances déjà compilées (≈ 2 h) et chaîne ARM64EC gardées d'un essai à l'autre : la recette
      # saute chaque paquet marqué terminé (deps/stamps).
      - name: Reprise des dépendances
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            ms/deps/prefix
            ms/deps/stamps
            ms/toolchain
            ms/install
          key: ambre3-deps-${{ inputs.ref }}-${{ github.run_id }}
          restore-keys: ambre3-deps-${{ inputs.ref }}-

      - name: Compilation complète (dépendances, ARM64X, Wine, FEX, tests, paquet)
        working-directory: ms
        run: |
          # Dossiers de travail que la recette suppose existants (ignorés par son .gitignore).
          mkdir -p logs downloads deps/stamps build install dist prefixes
          # La recette fixe 10 tâches en parallèle ; la machine de GitHub n'a que 3 cœurs et 7 Go.
          sed -i '' 's/^export JOBS=10$/export JOBS=${JOBS:-10}/' scripts/env.sh
          export JOBS=4
          # FEX : CMake fait analyser les sources C++ (modules) par clang-scan-deps, qui, appelé par
          # le lien de toolchain/mingw-shims, ne trouve ni la libc ni libc++ ; FEX n'a pas de modules.
          sed -i '' 's/-DCMAKE_BUILD_TYPE=Release /-DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DFMT_MODULE=OFF /' scripts/build-fex.sh
          grep -q SCAN_FOR_MODULES scripts/build-fex.sh
          # Wine déjà compilé et installé lors d'un essai précédent (gardé dans install/) : on le reprend.
          sed -i '' 's|^zsh \$S/build-wine.sh$|[[ -x ${0:A:h:h}/install/bin/wine ]] \&\& echo "wine : repris" \|\| zsh $S/build-wine.sh|' scripts/build-all.sh
          grep -n "build-wine" scripts/build-all.sh
          # Programmes d'essai DirectX de la recette liés sans les bibliothèques DirectX (oubli de leur
          # côté) : on les ajoute, sans effet sur les autres programmes.
          sed -i '' 's| \$src -o \$ROOT/tests/bin| $src -ld3d11 -ld3d12 -ldxgi -ldxguid -luser32 -lgdi32 -lole32 -o $ROOT/tests/bin|' scripts/build-tests.sh
          grep -q -- "-ld3d11" scripts/build-tests.sh
          zsh scripts/build-all.sh

      - name: Sauvegarde des dépendances
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ms/deps/prefix
            ms/deps/stamps
            ms/toolchain
            ms/install
          key: ambre3-deps-${{ inputs.ref }}-${{ github.run_id }}

      - name: Journaux en cas d'échec
        if: failure()
        working-directory: ms
        run: |
          for f in logs/*.log; do
            echo "::group::$f"
            grep -nE "error:|Error [0-9]|\*\*\*|fatal|undefined" "$f" | head -60 || true
            tail -40 "$f"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ambre3-journaux-${{ inputs.ref }}
          path: ms/logs
          retention-days: 7

      - name: Contenu
        if: always()
        working-directory: ms
        run: |
          ls -la dist 2>/dev/null || true
          du -sh dist/* 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ambre3-sans-autorisation-${{ inputs.ref }}
          path: |
            ms/dist/*.tar.xz
            ms/dist/*.tar.xz.sha256
          retention-days: 7
